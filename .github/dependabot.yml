version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    labels: [ci]
    commit-message:
      prefix: ci(deps)
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)
