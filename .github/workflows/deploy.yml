name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

# Opt-in: set repo variable ENABLE_DEPLOY=true once the secrets/vars in README.md exist.
# Unset = workflow skips (green).
jobs:
  deploy:
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.IMAGE_NAMESPACE }}/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          # PUBLIC_* are non-secret (visible in the shipped site), so they are repo variables
          build-args: |
            PUBLIC_SITE_URL=${{ vars.PUBLIC_SITE_URL }}
            PUBLIC_UMAMI_SCRIPT_URL=${{ vars.PUBLIC_UMAMI_SCRIPT_URL }}
            PUBLIC_UMAMI_WEBSITE_ID=${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Trigger Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: curl -L -X GET --fail-with-body "$DOKPLOY_URL/api/deploy/$WEBHOOK"

      - name: Smoke check
        env:
          SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "PUBLIC_SITE_URL not set, skipping"
            exit 0
          fi
          for i in $(seq 1 18); do
            if curl -fsS --max-time 10 "${SITE_URL%/}/health" >/dev/null; then
              echo "healthy"
              exit 0
            fi
            echo "waiting ($i/18)"
            sleep 10
          done
          echo "::error::${SITE_URL%/}/health did not become healthy in 3 min"
          exit 1

      # Optional: after the new container is healthy, so the edge cannot re-cache the old site
      - name: Purge Cloudflare cache
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "Cloudflare secrets not set, skipping"
            exit 0
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}'
