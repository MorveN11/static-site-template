# Cache policy by final URI: hashed assets immutable, HTML revalidated, rest short.
map $uri $cache_control {
  default "public, max-age=3600";
  ~^/_astro/ "public, max-age=31536000, immutable";
  ~\.html$ "no-cache";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml image/svg+xml;

  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # CSP: replace https://umami.example.com (script-src and connect-src) with the host of PUBLIC_UMAMI_SCRIPT_URL.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://umami.example.com; connect-src 'self' https://umami.example.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location = /health {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 'ok';
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
}
